name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # daily, so new releases show up within a day and expired NEW! badges
  # leave the page (site.js already hides them on time)
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # private extras, read with a read-only deploy key
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ArianARahimi/composersoftware-site-private
          path: private
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Build
        run: |
          python3 tools/csp.py .   # every page's security policy matches its inline code
          mkdir _site
          # Hidden files never go live: an accidentally committed .env or the like stays off the site.
          rsync -a --exclude '.*' --exclude private --exclude _site --exclude tools --exclude README.md ./ _site/
          sh private/build.sh _site
          python3 tools/releases.py _site
          python3 tools/redirects.py _site   # short and old addresses of the project pages
          python3 tools/csp.py _site --fix   # policies for what the steps above added
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
